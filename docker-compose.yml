services:
  postgres:
    image: postgres:17-alpine
    container_name: freight-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: freight_dev
    ports:
      - "5432:5432"
    volumes:
      - freight-pgdata:/var/lib/postgresql/data
      - ./docker/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d freight_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  freight-pgdata:
